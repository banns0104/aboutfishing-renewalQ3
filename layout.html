<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>어바웃피싱 · 화면 배치 보기</title>
<style>
  html,body{margin:0;height:100%;}
  body{
    background:#0041FF;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;
    color:#fff; display:flex; align-items:center; justify-content:center;
  }
  .wrap{ text-align:center; padding:32px; }
  .logo{ font-size:26px; font-weight:800; letter-spacing:-0.6px; }
  .logo .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:#0AD2FF; margin-left:3px; vertical-align:2px; }
  .sub{ margin-top:14px; font-size:15px; opacity:.85; letter-spacing:-0.3px; }
  .spinner{ margin:30px auto 0; width:34px; height:34px; border-radius:50%;
    border:3px solid rgba(255,255,255,.3); border-top-color:#fff; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .fallback{ margin-top:26px; font-size:14px; }
  .fallback a{ color:#fff; font-weight:700; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">어바웃피싱<span class="dot"></span></div>
    <div class="sub">전체 화면 배치 보기를 불러오는 중…</div>
    <div class="spinner"></div>
    <div class="fallback">자동으로 넘어가지 않으면 <a href="index.html?view=layout">여기를 눌러주세요</a></div>
  </div>
  <script>
    // 메인 앱을 열고 '전체 화면 배치 보기' 카탈로그를 자동으로 띄웁니다.
    location.replace('index.html?view=layout');
  </script>
</body>
</html>
